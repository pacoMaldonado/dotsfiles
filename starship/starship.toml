# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                     DOTFILES - STARSHIP CONFIGURATION                        ║
# ║            Basado en Gentleman.Dots — Adaptado para Linux                    ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
# Guía completa de uso y personalización en: ./GUIA_STARSHIP.md
# Los cambios que guardes en este archivo se ven reflejados apenas presiones Enter
# en tu terminal.

"$schema" = 'https://starship.rs/config-schema.json'

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ 1. DISEÑO Y ORDEN DEL PROMPT (FORMAT)                                        │
# └──────────────────────────────────────────────────────────────────────────────┘
format = """\
($directory)\
$os\
$git_branch\
$git_status\
$fill\
$python\
$nodejs\
$bun\
$rust\
$golang\
$php\
$java\
$c\
$zig\
$conda\
$docker_context\
$cmd_duration\
$time\
\n$character\
"""

add_newline = true
command_timeout = 2000

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ 2. SELECCIÓN DE TEMA / PALETA DE COLORES                                     │
# └──────────────────────────────────────────────────────────────────────────────┘
# Opciones disponibles abajo: "gentleman", "catppuccin_mocha", "tokyonight", "kanagawa", "gruvbox_dark"
palette = "gentleman"

[fill]
symbol = ' '

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ 3. SÍMBOLO DEL CURSOR / PROMPT (CHARACTER)                                   │
# └──────────────────────────────────────────────────────────────────────────────┘
# Puedes elegir cualquiera de estos iconos descomentando el par success/error que prefieras.
# Para buscar más iconos en internet: https://www.nerdfonts.com/cheat-sheet (botón "Copy Icon")

[character]
# Opción 1 (Activa): Flecha moderna limpia
# success_symbol = "[❯](bold fg:green)"
# error_symbol   = "[❯](bold fg:red)"

# Opción 2: Logo de Fedora Linux
# success_symbol = "[ ](bold fg:green)"
# error_symbol   = "[ ](bold fg:red)"

# Opción 3: Pingüino Tux de Linux
# success_symbol = "[ ](bold fg:green)"
# error_symbol   = "[ ](bold fg:red)"

# Opción 4: Símbolo Terminal (>_)
# success_symbol = "[󰘧 ](bold fg:green)"
# error_symbol   = "[󰘧 ](bold fg:red)"

# Opción 5: Lambda (λ)
# success_symbol = "[λ](bold fg:green)"
# error_symbol   = "[λ](bold fg:red)"

# Opción 6: Cohete / Rayo
# success_symbol = "[ ](bold fg:green)"
# error_symbol   = "[ ](bold fg:red)"
#
# Opción 7: Duck 
# success_symbol = "[󰇥](bold fg:green)"
# error_symbol = "[󰇥](bold fg:red)"
#
# Opción 8: Poop 
success_symbol = "[](bold fg:green)"
error_symbol = "[](bold fg:red)"

vimcmd_symbol = "[N](bold red)"
vimcmd_replace_one_symbol = "[R](bold peach)"
vimcmd_visual_symbol = "[V](bold mauve)"

[username]
style_user = 'bold blue'
style_root = 'bold red'
format = '[ $user](fg:$style) '
disabled = false
show_always = true

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ 4. DIRECTORIOS Y CARPETAS (ESPAÑOL + INGLÉS)                                 │
# └──────────────────────────────────────────────────────────────────────────────┘
[directory]
format = "[$path](bold $style)[$read_only]($read_only_style) "
truncation_length = 2
style = "fg:blue"
read_only_style = "fg:blue"
before_repo_root_style = "fg:blue"
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " 󰌾 "

[directory.substitutions]
# Español
"Proyectos"  = "󰲋 "
"Documentos" = "󰈙 "
"Descargas"  = " "
"Música"     = " "
"Imágenes"   = " "
"Escritorio" = "󰧨 "
"Vídeos"     = " "
# Inglés (por si instalas el sistema operativo en inglés)
"Projects"   = "󰲋 "
"Documents"  = "󰈙 "
"Downloads"  = " "
"Music"      = " "
"Pictures"   = " "
"Desktop"    = "󰧨 "
"Videos"     = " "

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ 5. GIT (RAMA Y ESTADO DE ARCHIVOS)                                           │
# └──────────────────────────────────────────────────────────────────────────────┘
[git_branch]
format = "-> [$symbol$branch]($style) "
style = "bold fg:mauve"
symbol = " "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold fg:pink"
conflicted = "=[$count] "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "\\$${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ 6. LENGUAJES DE PROGRAMACIÓN Y HERRAMIENTAS                                  │
# └──────────────────────────────────────────────────────────────────────────────┘
# Nota: Cada lenguaje solo aparece en el prompt cuando entras a una carpeta
#       que contiene un proyecto de ese lenguaje.

[python]
disabled = false
format = '[[ $symbol$pyenv_prefix($version)( \($virtualenv\)) ](fg:peach)]($style)'
symbol = " "
version_format = "$raw"

[nodejs]
disabled = false
symbol = " "
format = '[[ $symbol($version) ](fg:green)]($style)'

[bun]
disabled = false
symbol = " "
version_format = "$raw"
format = '[[ $symbol($version) ](fg:text)]($style)'

[rust]
disabled = false
symbol = " "
format = '[[ $symbol($version) ](fg:red)]($style)'

[golang]
disabled = false
symbol = " "
format = '[[ $symbol($version) ](fg:teal)]($style)'

[php]
disabled = false
symbol = " "
format = '[[ $symbol($version) ](fg:peach)]($style)'

[java]
disabled = false
symbol = " "
version_format = "$raw"
format = '[[ $symbol($version) ](fg:red)]($style)'

[c]
disabled = false
symbol = " "
version_format = "$raw"
format = '[[ $symbol($version) ](fg:blue)]($style)'

[zig]
disabled = false
symbol = " "
version_format = "$raw"
format = '[[ $symbol($version) ](fg:peach)]($style)'

[docker_context]
disabled = false
symbol = " "
format = '[[ $symbol$context ](fg:blue)]($style)'
only_with_files = true

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ 7. TIEMPO DE EJECUCIÓN Y RELOJ                                               │
# └──────────────────────────────────────────────────────────────────────────────┘
[cmd_duration]
format = " took [ $duration]($style) "
style = "bold fg:yellow"
min_time = 500

[time]
disabled = false
time_format = "%R"
format = '[[  $time ](fg:subtext0)]($style)'

